<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>部落衝突 - 天神試煉版</title>
    <style>
        body { min-height: 100vh; overflow-y: auto; overflow-x: hidden; background-color: #0b0e14; color: #fff; font-family: 'Impact', sans-serif; margin: 0; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; text-align: center; transition: 0.5s; }
        .view { display: none; width: 100%; height: 100%; flex-direction: column; } .active { display: flex; }
        .shadow-text { color: #f39c12; font-size: 32px; text-shadow: 3px 3px 5px #000; margin: 5px 0; }
        
        /* 決戰時刻標題變色 */
        .final-battle-title { color: #ff4757 !important; text-shadow: 0 0 20px #ff4757; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; } }

        /* 計時器移到右上方固定，並半透明，絕對不擋字 */
        .timer-display { position: fixed; top: 20px; right: 20px; background: rgba(231, 76, 60, 0.8); color: white; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 4px solid #c0392b; box-shadow: 0 0 20px #e74c3c; z-index: 9999; }

        .q-card { background: rgba(26, 26, 46, 0.95); border: 4px solid #f39c12; padding: 15px 20px; border-radius: 15px; margin: 10px auto; width: 90%; max-width: 1000px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); position: relative; }
        .q-text { font-size: 26px; margin-bottom: 10px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 22px; text-align: left; }
        .opt { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 10px; border: 3px solid #333; }
        .opt-correct { background: #27ae60 !important; border-color: #2ecc71 !important; box-shadow: 0 0 15px #2ecc71;}
        #explanation { margin-top: 10px; background: #2c3e50; padding: 10px; text-align: left; display: none; font-size: 20px; border-radius:10px; }
        
        .tribe-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 5px; }
        .card { background: rgba(22, 33, 62, 0.85); border: 3px solid #0f3460; padding: 5px; border-radius: 10px; width: 105px; position: relative; transition: 0.3s; }
        .card img { width: 50px; height: 50px; object-fit: contain; margin: 2px 0; }
        .card h3 { margin: 0; color: #00d2ff; font-size: 15px; }
        .hp { font-size: 28px; color: #e74c3c; margin: 2px 0; }
        .status { font-size: 12px; color: #aaa; background: #000; padding: 3px; border-radius: 5px; }

        /* 跳血特效文字 */
        .dmg-popup { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); color: #ff4757; font-size: 30px; font-weight: bold; animation: floatUp 1s forwards; pointer-events: none; z-index: 100;}
        @keyframes floatUp { 0% { opacity: 1; top: 0; } 100% { opacity: 0; top: -50px; } }

        /* 撒花與雷劈動畫 */
        .confetti-effect { animation: confettiGlow 0.5s infinite alternate; box-shadow: 0 0 30px #f1c40f !important; border-color: #f1c40f !important; }
        @keyframes confettiGlow { from { transform: scale(1); } to { transform: scale(1.05); } }

        .lightning-effect { animation: lightningFlash 0.2s 3; background: #fff !important; }
        @keyframes lightningFlash { 0% { background: #fff; } 50% { background: #e74c3c; } 100% { background: #000; } }
        .shake-heavy { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(1px, 2px); } }

        .log-box { background: rgba(0,0,0,0.85); color: #f1c40f; padding: 15px; flex-grow: 1; overflow-y: auto; text-align: left; font-size: 26px; border-left: 10px solid #f1c40f; border-radius: 10px; margin: 10px auto; width: 90%; }
        .big-btn { font-family: 'Impact', sans-serif; padding: 12px 25px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 24px; margin: 5px; box-shadow: 0 5px 0 #2980b9;}
        .reset-btn { position: fixed; top: 15px; left: 15px; background: #c0392b; color: white; padding: 8px 12px; border-radius: 8px; border: 2px solid white; cursor: pointer; font-size: 14px; z-index: 1000; }
    </style>
</head>
<body id="main-body">
    <button class="reset-btn" onclick="if(confirm('確定要重啟遊戲嗎？所有進度與連線部落將會重置！')) socket.emit('reset_game')">🔄 遊戲重啟</button>
    <div id="timer-box" class="timer-display" style="display:none;">40</div>

    <h1 id="main-title" class="shadow-text">🔥 部落衝突：薩滿之戰 🔥</h1>

    <div id="view-setup" class="view active">
        <h2>設定部落數量</h2>
        <input type="number" id="teamCount" value="10" style="font-size: 45px; width: 100px; text-align: center;"><br>
        <button class="big-btn" onclick="setupTeams()">初始化大廳</button>
    </div>

    <div id="view-lobby" class="view">
        <h2>🏠 等待部落連線中...</h2>
        <div id="lobby-grid" class="tribe-grid"></div>
        <div><button class="big-btn" style="background:#e74c3c;" onclick="startGame()">⚔️ START GAME</button></div>
    </div>

    <div id="view-qna" class="view">
        <div class="q-card">
            <div id="q-text" class="q-text">題目載入中...</div>
            <div class="options">
                <div class="opt" id="opt-A">A: </div><div class="opt" id="opt-B">B: </div>
                <div class="opt" id="opt-C">C: </div><div class="opt" id="opt-D">D: </div>
            </div>
            <div id="explanation"></div>
        </div>
        <div id="qna-grid" class="tribe-grid"></div>
        <div>
            <button id="btn-reveal" class="big-btn" onclick="control('reveal')">👁️ 公佈解答</button>
            <button id="btn-actions" class="big-btn" style="background:#e74c3c; display:none;" onclick="control('show_actions')">⚔️ 進入戰鬥環節</button>
        </div>
    </div>

    <div id="view-combat" class="view">
        <div id="combat-grid" class="tribe-grid"></div>
        <div class="log-box" id="combat-log"></div>
        <div>
            <button id="btn-next-action" class="big-btn" onclick="socket.emit('combat_step')">▶️ 進行下一個動作</button>
            <button id="btn-punish" class="big-btn" style="background:#8e44ad; display:none;" onclick="control('resolve_punishments')">💀 進入天譴環節</button>
            <button id="btn-combat-end-round" class="big-btn" style="background:#f39c12; display:none;" onclick="control('end_round')">⏹️ 結束這回合</button>
        </div>
    </div>

    <div id="view-punish" class="view">
        <div id="punish-grid" class="tribe-grid"></div>
        <div id="teacher-punish-controls" style="display:none; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; border: 4px solid #e74c3c; margin: 10px auto; width: 80%;">
            <h2 id="punish-target-name" style="color: #ff7675; margin-top:0;">⚠️ 正在懲罰：</h2>
            <h3 id="punish-pot-display" style="color: #f1c40f;">累積傷害：</h3>
            <button class="big-btn" style="background:#d63031;" onclick="socket.emit('teacher_submit_punish', 'take')">該部落自行承受傷害</button>
            <button id="btn-pass-punish" class="big-btn" style="background:#6c5ce7;" onclick="socket.emit('teacher_submit_punish', 'pass')">無情加倍傳遞厄運盲盒</button>
        </div>
        <div class="log-box" id="punish-log"></div>
        <div>
            <button id="btn-start-magic" class="big-btn" style="background:#8e44ad; display:none;" onclick="control('start_magic')">🪄 進入魔法祭壇</button>
            <button id="btn-punish-end-round" class="big-btn" style="background:#f39c12; display:none;" onclick="control('end_round')">⏹️ 結束這回合</button>
        </div>
    </div>

    <div id="view-transition" class="view" style="justify-content: center; align-items: center;">
        <h1 style="font-size: 60px; color: #f1c40f;" id="transition-title"></h1>
        <button id="btn-challenge-next" class="big-btn" style="font-size: 40px; padding: 20px 40px; background: #e74c3c;" onclick="startCountdown()">準備挑戰下一題</button>
        <h1 id="countdown-text" style="font-size: 150px; display: none;">3</h1>
    </div>

    <div id="view-endgame" class="view">
        <h2 style="font-size: 50px; color: #f1c40f; margin: 20px 0;">🏆 終局結算排行榜 🏆</h2>
        <div id="endgame-grid" class="tribe-grid" style="gap: 30px;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentQIndex = -1;

        socket.on('timer_update', (time) => {
            const timerEl = document.getElementById('timer-box');
            timerEl.innerText = time;
            timerEl.style.display = 'flex';
        });

        socket.on('state_update', (state) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            currentQIndex = state.currentQuestionIndex;

            const title = document.getElementById('main-title');
            if(currentQIndex === 10) title.classList.add('final-battle-title');
            else title.classList.remove('final-battle-title');

            if(state.phase === 'setup') {
                document.getElementById('view-setup').classList.add('active');
                document.getElementById('timer-box').style.display = 'none';
            }
            else if(state.phase === 'lobby') {
                document.getElementById('view-lobby').classList.add('active');
                renderGrid('lobby-grid', state);
                document.getElementById('timer-box').style.display = 'none';
            } 
            else if (['answering', 'reveal_answers'].includes(state.phase)) {
                document.getElementById('view-qna').classList.add('active');
                renderQnA(state);
                renderGrid('qna-grid', state);
                if(state.phase !== 'answering') document.getElementById('timer-box').style.display = 'none';
            }
            else if (state.phase === 'show_actions' || state.phase === 'magic_phase') {
                document.getElementById('view-combat').classList.add('active');
                renderGrid('combat-grid', state);
                const qLen = state.combatQueue.length;
                document.getElementById('btn-next-action').style.display = (qLen > 0) ? 'inline-block' : 'none';
                if (state.phase === 'show_actions') {
                    document.getElementById('btn-punish').style.display = (qLen === 0) ? 'inline-block' : 'none';
                    document.getElementById('btn-combat-end-round').style.display = 'none';
                } else {
                    document.getElementById('btn-punish').style.display = 'none';
                    if (qLen === 0) document.getElementById('btn-combat-end-round').style.display = 'inline-block';
                }
                document.getElementById('combat-log').innerHTML = state.logs.map(l => `<p>> ${l}</p>`).join('');
                document.getElementById('timer-box').style.display = 'none';
            }
            else if (['punish_turn', 'punishments_done'].includes(state.phase)) {
                document.getElementById('view-punish').classList.add('active');
                renderGrid('punish-grid', state);
                const punishControls = document.getElementById('teacher-punish-controls');
                if(state.phase === 'punish_turn' && state.currentPunishTeam !== 'waiting') {
                    punishControls.style.display = 'block';
                    document.getElementById('punish-target-name').innerText = `⚠️ 正在懲罰：${state.teams[state.currentPunishTeam].name}`;
                    document.getElementById('punish-pot-display').innerText = `🔥 累積傷害：${state.punishmentPot} 分`;
                    document.getElementById('btn-pass-punish').style.display = state.isLastPunish ? 'none' : 'inline-block';
                } else {
                    punishControls.style.display = 'none';
                }
                if(state.phase === 'punishments_done') {
                    const isMagic = state.question['題目類型'] === '特殊' || currentQIndex === 10;
                    document.getElementById('btn-start-magic').style.display = isMagic ? 'inline-block' : 'none';
                    document.getElementById('btn-punish-end-round').style.display = isMagic ? 'none' : 'inline-block';
                }
                document.getElementById('punish-log').innerHTML = state.logs.map(l => `<p>> ${l}</p>`).join('');
                document.getElementById('timer-box').style.display = 'none';
            }
            else if (state.phase === 'round_transition') {
                document.getElementById('view-transition').classList.add('active');
                const titleText = currentQIndex === -1 ? "🔥 準備進行天神試煉 🔥" : (currentQIndex === 0 ? "✨ 試煉題結束，所有部落獲得庇護血量重置 ✨" : `第 ${currentQIndex} 題 結束`);
                document.getElementById('transition-title').innerText = titleText;
                document.getElementById('btn-challenge-next').innerText = `開始第 ${currentQIndex + 1} 題`;
                document.getElementById('btn-challenge-next').style.display = 'inline-block';
                document.getElementById('countdown-text').style.display = 'none';
                document.getElementById('timer-box').style.display = 'none';
            }
            else if (state.phase === 'end_game') {
                document.getElementById('view-endgame').classList.add('active');
                renderEndGame(state.endGameRanks);
                document.getElementById('timer-box').style.display = 'none';
            }
        });

        function setupTeams() { socket.emit('teacher_setup', document.getElementById('teamCount').value); }
        function startGame() { socket.emit('teacher_start'); }
        function control(action) { 
            if(action === 'end_round' && currentQIndex >= 10) socket.emit('teacher_control', 'end_game');
            else socket.emit('teacher_control', action); 
        }

        function startCountdown() {
            let count = 3;
            document.getElementById('btn-challenge-next').style.display = 'none';
            const cdText = document.getElementById('countdown-text');
            cdText.style.display = 'block';
            cdText.innerText = count;
            let iv = setInterval(() => {
                count--;
                if(count > 0) cdText.innerText = count;
                else { clearInterval(iv); control('next'); }
            }, 1000);
        }

        function renderQnA(state) {
            const q = state.question;
            if(!q) return;
            const qNum = currentQIndex === 0 ? "試煉題" : `Q${currentQIndex}`;
            document.getElementById('q-text').innerText = `${qNum}. ${q['題目']} (${(q['題目類型'] === '特殊' || currentQIndex===10) ? '🌟魔法題' : '📜普通題'})`;
            ['A','B','C','D'].forEach(o => {
                const opt = document.getElementById(`opt-${o}`);
                opt.innerText = `${o}: ${q[o]}`;
                opt.classList.remove('opt-correct');
                if(state.phase !== 'answering' && q['正確答案'] === o) opt.classList.add('opt-correct');
            });
            const exp = document.getElementById('explanation');
            if(state.phase !== 'answering' && q['詳解']) { exp.style.display = 'block'; exp.innerHTML = `💡 詳解：${q['詳解']}`; } 
            else { exp.style.display = 'none'; }
        }

        function renderGrid(containerId, state) {
            const g = document.getElementById(containerId); g.innerHTML = '';
            Object.values(state.teams).forEach(t => {
                let cardClass = 'card';
                let status = t.locked ? '🔒 已鎖定' : '⏳ 等待中...';
                if(containerId === 'lobby-grid') status = t.connected ? '🟢 已連線' : '⏳ 等待中';
                
                let dmgText = "";
                if(['show_actions', 'magic_phase'].includes(state.phase) && state.currentCombatEvent) {
                    if(state.currentCombatEvent.actor === t.id || state.currentCombatEvent.target === t.id) {
                        cardClass += ` anim-${state.currentCombatEvent.anim}`;
                        if(state.currentCombatEvent.damage && state.currentCombatEvent.actor === t.id) {
                            dmgText = `<div class="dmg-popup">-${state.currentCombatEvent.damage}</div>`;
                        }
                    }
                }
                g.innerHTML += `<div class="${cardClass}">
                    ${dmgText}
                    <h3>${t.name}</h3>
                    <img src="/assets/${t.id}.png" onerror="this.src='/assets/shaman_blocky.png'">
                    <div class="hp">${t.hp}</div>
                    <div class="status">${status}</div>
                </div>`;
            });
        }

        function renderEndGame(ranks) {
            const g = document.getElementById('endgame-grid'); g.innerHTML = '';
            ranks.forEach((t, index) => {
                const rankNum = index + 1;
                g.innerHTML += `
                <div class="flip-card" id="end-card-${t.id}" onclick="handleFlip('${t.id}', ${rankNum}, ${ranks.length})">
                    <div class="flip-card-inner">
                        <div class="flip-front">
                            <div class="flip-front-rank">第 ${rankNum} 名</div>
                        </div>
                        <div class="flip-back">
                            <div class="rank-num">第 ${rankNum} 名</div>
                            <img src="/assets/${t.id}.png" style="width:70px;">
                            <h3>${t.name}</h3>
                            <div style="font-size:30px; color:#e74c3c;">${t.hp}❤️</div>
                        </div>
                    </div>
                </div>`;
            });
        }

        function handleFlip(id, rank, total) {
            const el = document.getElementById(`end-card-${id}`);
            el.classList.toggle('flipped');
            if(rank <= 3) {
                el.classList.add('confetti-effect');
            }
            if(rank > total - 3) {
                const body = document.getElementById('main-body');
                body.classList.add('shake-heavy');
                el.classList.add('lightning-effect');
                setTimeout(() => {
                    body.classList.remove('shake-heavy');
                    el.classList.remove('lightning-effect');
                }, 600);
            }
        }
    </script>
</body>
</html>
