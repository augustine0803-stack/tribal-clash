<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>部落衝突 - 2.0 大螢幕</title>
    <style>
        body { background-color: #0b0e14; background-size: cover; background-position: center; background-attachment: fixed; color: #fff; font-family: 'Impact', 'Arial Black', sans-serif; margin: 0; padding: 20px; text-align: center; transition: background-image 0.5s ease-in-out; overflow-x: hidden;}
        .view { display: none; } .active { display: block; }
        .shadow-text { color: #f39c12; font-size: 45px; text-shadow: 3px 3px 5px rgba(0,0,0,0.8); margin-top: 0; }
        
        .q-card { background: rgba(26, 26, 46, 0.95); border: 4px solid #f39c12; padding: 30px; border-radius: 15px; margin: 0 auto 30px auto; max-width: 1000px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;}
        .timer-display { position: absolute; top: -30px; right: -30px; background: #e74c3c; color: white; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 4px solid #c0392b; box-shadow: 0 0 15px #e74c3c; z-index: 10; }
        .q-text { font-size: 36px; margin-bottom: 20px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 28px; text-align: left; }
        .opt { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; border: 3px solid #333; transition: 0.3s; }
        .opt-correct { background: #27ae60 !important; border-color: #2ecc71 !important; color: white; box-shadow: 0 0 15px #2ecc71;}
        
        .tribe-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 100%; padding: 10px; }
        .card { background: rgba(22, 33, 62, 0.85); border: 4px solid #0f3460; padding: 15px; border-radius: 15px; width: 160px; transition: 0.3s; backdrop-filter: blur(5px); }
        .card img { width: 100px; height: 100px; object-fit: contain; image-rendering: pixelated; margin: 10px 0; }
        .card h3 { margin: 0; color: #00d2ff; font-size: 22px; text-shadow: 2px 2px #000; }
        .hp { font-size: 45px; color: #e74c3c; margin: 10px 0; text-shadow: 2px 2px #000; }
        .status { font-size: 16px; color: #aaa; background: #000; padding: 5px; border-radius: 5px; }
        
        /* --- 終局卡牌翻轉特效 --- */
        .flip-card { background-color: transparent; width: 180px; height: 250px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 4px solid #f39c12; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
        .flip-front { background: url('/assets/bg_combat.png') center/cover; }
        /* 移除巨型問號，改為超帥的名牌設計 */
        .flip-front-rank { font-size: 40px; color: #fff; text-shadow: 3px 3px 5px #000; font-weight: bold; background: rgba(0,0,0,0.85); border: 3px solid #f1c40f; padding: 15px 25px; border-radius: 15px; box-shadow: 0 0 20px #f1c40f; }
        .flip-back { background: #16213e; transform: rotateY(180deg); border-color: #2ecc71; }
        .rank-num { font-size: 30px; color: #f1c40f; margin-bottom: 10px; }

        .anim-attack { animation: attackMove 0.4s infinite alternate; border-color: #c0392b; box-shadow: 0 0 25px #c0392b; }
        .anim-defend { border-color: #3498db; box-shadow: 0 0 25px #3498db; }
        .anim-hit { animation: shake 0.3s infinite; border-color: #e74c3c; background: rgba(127, 35, 28, 0.8); }
        .anim-magic { animation: magicPulse 0.5s infinite alternate; border-color: #9b59b6; box-shadow: 0 0 30px #9b59b6; }
        .punish-highlight { border: 8px solid #e056fd !important; animation: shake 0.5s infinite; transform: scale(1.1); box-shadow: 0 0 30px #e056fd; }

        @keyframes attackMove { from { transform: translateY(0); } to { transform: translateY(-30px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-15px); } 75% { transform: translateX(15px); } }
        @keyframes magicPulse { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(90deg); } }

        .big-btn { font-family: 'Impact', sans-serif; padding: 15px 30px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 26px; margin: 10px; box-shadow: 0 6px 0 #2980b9;}
        .log-box { background: rgba(0,0,0,0.85); color: #f1c40f; padding: 20px; height: 150px; overflow-y: auto; text-align: left; font-size: 24px; border-left: 10px solid #f1c40f; border-radius: 10px; margin: 20px auto; max-width: 1000px;}
        
        .reset-btn { position: fixed; top: 15px; left: 15px; background: #c0392b; color: white; padding: 10px 15px; border-radius: 8px; border: 2px solid white; cursor: pointer; font-size: 16px; font-family: 'Impact', sans-serif; z-index: 1000; box-shadow: 0 4px #7f8c8d; }
        .kick-btn { margin-top: 10px; padding: 5px 10px; background: #c0392b; color: white; border: none; border-radius: 5px; cursor: pointer; font-family: 'Impact', sans-serif; }
    </style>
</head>
<body>
    <button class="reset-btn" onclick="if(confirm('確定要重啟遊戲嗎？所有進度與連線將會重置！')) socket.emit('reset_game')">🔄 遊戲重啟</button>

    <h1 id="main-title" class="shadow-text">🔥 部落衝突：薩滿之戰 🔥</h1>

    <div id="view-setup" class="view active">
        <h2>設定部落數量</h2>
        <input type="number" id="teamCount" value="10" style="font-size: 45px; width: 100px; text-align: center;"><br>
        <button class="big-btn" onclick="setupTeams()">初始化大廳</button>
    </div>

    <div id="view-lobby" class="view">
        <h2>🏠 等待部落連線...</h2>
        <div id="lobby-grid" class="tribe-grid"></div><br>
        <button class="big-btn" style="background:#e74c3c; box-shadow: 0 6px 0 #c0392b;" onclick="startGame()">⚔️ START GAME</button>
    </div>

    <div id="view-qna" class="view">
        <div class="q-card">
            <div class="timer-display" id="teacher-timer">40</div>
            <div id="q-text" class="q-text">題目載入中...</div>
            <div class="options">
                <div class="opt" id="opt-A">A: </div><div class="opt" id="opt-B">B: </div>
                <div class="opt" id="opt-C">C: </div><div class="opt" id="opt-D">D: </div>
            </div>
            <div id="explanation" style="margin-top: 20px; background: #2c3e50; padding: 20px; text-align: left; display: none; font-size: 24px; border-radius:10px;"></div>
        </div>
        <div id="qna-grid" class="tribe-grid"></div><br>
        <button id="btn-reveal" class="big-btn" onclick="control('reveal')">👁️ 1. 公佈解答</button>
        <button id="btn-actions" class="big-btn" style="background:#e74c3c; display:none; box-shadow: 0 6px 0 #c0392b;" onclick="control('show_actions')">⚔️ 2. 進入戰鬥展演</button>
    </div>

    <div id="view-combat" class="view">
        <div id="combat-grid" class="tribe-grid"></div>
        <br>
        <button id="btn-next-action" class="big-btn" onclick="socket.emit('combat_step')">▶️ 播放下一個動作</button>
        <button id="btn-punish" class="big-btn" style="background:#8e44ad; display:none; box-shadow: 0 6px 0 #732d91;" onclick="control('resolve_punishments')">💀 3. 進入天譴環節</button>
        <button id="btn-combat-next" class="big-btn" style="background:#2ecc71; display:none; box-shadow: 0 6px 0 #27ae60;" onclick="control('next')">➡️ 5. 開始下一題</button>
        <button id="btn-combat-end" class="big-btn" style="background:#f1c40f; display:none; box-shadow: 0 6px 0 #d4ac0d;" onclick="control('end_game')">🏆 5. 進入最終結算</button>
        <div class="log-box" id="combat-log"></div>
    </div>

    <div id="view-punish" class="view">
        <div id="punish-grid" class="tribe-grid"></div>
        <br>
        <button id="btn-start-magic" class="big-btn" style="background:#8e44ad; display:none; box-shadow: 0 6px 0 #732d91;" onclick="control('start_magic')">🪄 4. 進入魔法祭壇</button>
        <button id="btn-punish-next" class="big-btn" style="background:#2ecc71; display:none; box-shadow: 0 6px 0 #27ae60;" onclick="control('next')">➡️ 4. 開始下一題</button>
        <button id="btn-punish-end" class="big-btn" style="background:#f1c40f; display:none; box-shadow: 0 6px 0 #d4ac0d;" onclick="control('end_game')">🏆 4. 進入最終結算</button>
        <div class="log-box" id="punish-log"></div>
    </div>

    <div id="view-endgame" class="view">
        <h2 style="font-size: 50px; color: #f1c40f; text-shadow: 3px 3px #000;">🏆 終局結算排行榜 🏆</h2>
        <div id="endgame-grid" class="tribe-grid" style="gap: 30px;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentQIndex = 0;
        let isSpecialQuestion = false;

        socket.on('timer_update', (time) => {
            const timerEl = document.getElementById('teacher-timer');
            timerEl.innerText = time;
            if(time <= 10) timerEl.style.background = '#8e44ad';
            else timerEl.style.background = '#e74c3c';
        });

        socket.on('state_update', (state) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            currentQIndex = state.currentQuestionIndex;
            
            if(state.question) {
                isSpecialQuestion = state.question['題目類型'] === '特殊';
            }

            if(state.phase === 'show_actions') {
                document.body.style.backgroundImage = "url('/assets/bg_combat.png')";
                document.getElementById('main-title').style.display = 'none';
            } else if (['punish_turn', 'punishments_done'].includes(state.phase)) {
                document.body.style.backgroundImage = "url('/assets/bg_punish.png')";
                document.getElementById('main-title').style.display = 'none';
            } else if (state.phase === 'magic_phase') {
                document.body.style.backgroundImage = "url('/assets/bg_combat.png')";
                document.getElementById('main-title').style.display = 'none';
            } else {
                document.body.style.backgroundImage = "none";
                document.getElementById('main-title').style.display = 'block';
            }

            if(state.phase === 'setup') document.getElementById('view-setup').classList.add('active');
            else if(state.phase === 'lobby') {
                document.getElementById('view-lobby').classList.add('active');
                renderGrid('lobby-grid', state);
            } 
            else if (['answering', 'reveal_answers'].includes(state.phase)) {
                document.getElementById('view-qna').classList.add('active');
                if(state.phase === 'answering') document.getElementById('teacher-timer').innerText = state.timeLeft;
                renderQnA(state);
                renderGrid('qna-grid', state);
            }
            else if (state.phase === 'show_actions' || state.phase === 'magic_phase') {
                document.getElementById('view-combat').classList.add('active');
                renderGrid('combat-grid', state);
                
                const qLen = state.combatQueue.length;
                document.getElementById('btn-next-action').style.display = (qLen > 0) ? 'inline-block' : 'none';
                
                if (state.phase === 'show_actions') {
                    document.getElementById('btn-punish').style.display = (qLen === 0) ? 'inline-block' : 'none';
                    document.getElementById('btn-combat-next').style.display = 'none';
                    document.getElementById('btn-combat-end').style.display = 'none';
                } else {
                    document.getElementById('btn-punish').style.display = 'none';
                    if (qLen === 0) {
                        if (currentQIndex >= 9) {
                            document.getElementById('btn-combat-end').style.display = 'inline-block';
                            document.getElementById('btn-combat-next').style.display = 'none';
                        } else {
                            document.getElementById('btn-combat-next').style.display = 'inline-block';
                            document.getElementById('btn-combat-end').style.display = 'none';
                        }
                    } else {
                        document.getElementById('btn-combat-next').style.display = 'none';
                        document.getElementById('btn-combat-end').style.display = 'none';
                    }
                }
                
                document.getElementById('combat-log').innerHTML = state.logs.map(l => `<p>> ${l}</p>`).join('');
                document.getElementById('combat-log').scrollTop = document.getElementById('combat-log').scrollHeight;
            }
            else if (['punish_turn', 'punishments_done'].includes(state.phase)) {
                document.getElementById('view-punish').classList.add('active');
                renderGrid('punish-grid', state);
                document.getElementById('punish-log').innerHTML = state.logs.map(l => `<p>> ${l}</p>`).join('');
                document.getElementById('punish-log').scrollTop = document.getElementById('punish-log').scrollHeight;
                
                if(state.phase === 'punishments_done') {
                    if (isSpecialQuestion) {
                        document.getElementById('btn-start-magic').style.display = 'inline-block';
                        document.getElementById('btn-punish-next').style.display = 'none';
                        document.getElementById('btn-punish-end').style.display = 'none';
                    } else if (currentQIndex >= 9) {
                        document.getElementById('btn-start-magic').style.display = 'none';
                        document.getElementById('btn-punish-end').style.display = 'inline-block';
                        document.getElementById('btn-punish-next').style.display = 'none';
                    } else {
                        document.getElementById('btn-start-magic').style.display = 'none';
                        document.getElementById('btn-punish-next').style.display = 'inline-block';
                        document.getElementById('btn-punish-end').style.display = 'none';
                    }
                } else {
                    document.getElementById('btn-start-magic').style.display = 'none';
                    document.getElementById('btn-punish-next').style.display = 'none';
                    document.getElementById('btn-punish-end').style.display = 'none';
                }
            }
            else if (state.phase === 'end_game') {
                document.getElementById('view-endgame').classList.add('active');
                renderEndGame(state.endGameRanks);
            }
        });

        function setupTeams() { socket.emit('teacher_setup', document.getElementById('teamCount').value); }
        function startGame() { socket.emit('teacher_start'); }
        function control(action) { socket.emit('teacher_control', action); }

        function renderQnA(state) {
            const q = state.question;
            if(!q) return;
            document.getElementById('q-text').innerText = `Q${state.currentQuestionIndex + 1}. ${q['題目']} (${q['題目類型'] === '特殊' ? '🌟魔法題' : '📜普通題'})`;
            ['A','B','C','D'].forEach(o => {
                const opt = document.getElementById(`opt-${o}`);
                opt.innerText = `${o}: ${q[o]}`;
                // 強制清空上一題殘留的綠底
                opt.classList.remove('opt-correct');
                if(state.phase !== 'answering' && q['正確答案'] === o) {
                    opt.classList.add('opt-correct');
                }
            });
            const exp = document.getElementById('explanation');
            if(state.phase !== 'answering' && q['詳解']) { exp.style.display = 'block'; exp.innerHTML = `💡 詳解：${q['詳解']}`; } 
            else { exp.style.display = 'none'; }
            
            document.getElementById('btn-reveal').style.display = (state.phase === 'answering') ? 'inline-block' : 'none';
            document.getElementById('btn-actions').style.display = (state.phase === 'reveal_answers') ? 'inline-block' : 'none';
        }

        function renderGrid(containerId, state) {
            const g = document.getElementById(containerId); g.innerHTML = '';
            Object.values(state.teams).forEach(t => {
                let cardClass = 'card';
                let status = t.locked ? '🔒 已鎖定' : '⏳ 等待作答...';
                
                if(containerId === 'lobby-grid') {
                    status = t.connected 
                        ? `🟢 已連線<br><button class="kick-btn" onclick="socket.emit('force_disconnect', '${t.id}')">斷線重連</button>` 
                        : '⏳ 等待中';
                }
                
                if(t.locked) cardClass += ' locked';
                
                if(['show_actions', 'magic_phase'].includes(state.phase) && state.currentCombatEvent) {
                    if(state.currentCombatEvent.actor === t.id || state.currentCombatEvent.target === t.id) {
                        cardClass += ` anim-${state.currentCombatEvent.anim}`;
                    }
                }

                if(state.phase === 'punish_turn' && state.currentPunishTeam === t.id) cardClass += ' punish-highlight';
                else if(state.phase !== 'answering' && state.phase !== 'show_actions' && state.phase !== 'magic_phase' && containerId !== 'lobby-grid') {
                    if(t.answer) status = t.isCorrect ? '⭕ 答對' : '❌ 答錯';
                    else if(t.locked) status = '❌ 超時未答';
                }
                
                let imgSrc = `/assets/${t.id}.png`;

                g.innerHTML += `<div class="${cardClass}">
                    <h3>${t.name}</h3>
                    <img src="${imgSrc}" onerror="this.src='/assets/shaman_blocky.png'">
                    <div class="hp">${t.hp}</div>
                    <div class="status">${status}</div>
                </div>`;
            });
        }

        function renderEndGame(ranks) {
            const g = document.getElementById('endgame-grid'); g.innerHTML = '';
            ranks.forEach((t, index) => {
                const rankNum = index + 1;
                // 這裡的 HTML 已經移除了原本的問號，並加上名牌設計
                g.innerHTML += `
                <div class="flip-card" onclick="this.classList.toggle('flipped')">
                    <div class="flip-card-inner">
                        <div class="flip-front">
                            <div class="flip-front-rank">第 ${rankNum} 名</div>
                        </div>
                        <div class="flip-back">
                            <div class="rank-num">第 ${rankNum} 名</div>
                            <img src="/assets/${t.id}.png" onerror="this.src='/assets/shaman_blocky.png'" style="width:80px;height:80px;image-rendering:pixelated;">
                            <h3 style="margin:5px 0; color:#fff;">${t.name}</h3>
                            <div style="font-size:35px; color:#e74c3c; font-weight:bold;">${t.hp}❤️</div>
                        </div>
                    </div>
                </div>`;
            });
        }
    </script>
</body>
</html>
