<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>部落衝突 - 2.0 大螢幕</title>
    <style>
        body { height: 100vh; overflow: hidden; background-color: #0b0e14; background-size: cover; background-position: center; background-attachment: fixed; color: #fff; font-family: 'Impact', 'Arial Black', sans-serif; margin: 0; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; text-align: center; transition: background-image 0.5s ease-in-out; }
        .view { display: none; width: 100%; height: 100%; flex-direction: column; } .active { display: flex; }
        .shadow-text { color: #f39c12; font-size: 35px; text-shadow: 3px 3px 5px rgba(0,0,0,0.8); margin: 0 0 10px 0; flex-shrink: 0; }
        
        .q-card { background: rgba(26, 26, 46, 0.95); border: 4px solid #f39c12; padding: 15px; border-radius: 15px; margin: 0 auto 10px auto; max-width: 1000px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); position: relative; flex-shrink: 0;}
        .timer-display { position: absolute; top: -20px; right: -20px; background: #e74c3c; color: white; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; border: 4px solid #c0392b; box-shadow: 0 0 15px #e74c3c; z-index: 10; }
        .q-text { font-size: 30px; margin-bottom: 10px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 24px; text-align: left; }
        .opt { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; border: 3px solid #333; transition: 0.3s; }
        .opt-correct { background: #27ae60 !important; border-color: #2ecc71 !important; color: white; box-shadow: 0 0 15px #2ecc71;}
        
        .tribe-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 100%; padding: 5px; flex-shrink: 0; }
        .card { background: rgba(22, 33, 62, 0.85); border: 3px solid #0f3460; padding: 5px 10px; border-radius: 12px; width: 120px; transition: 0.3s; backdrop-filter: blur(5px); }
        .card img { width: 60px; height: 60px; object-fit: contain; image-rendering: pixelated; margin: 5px 0; }
        .card h3 { margin: 0; color: #00d2ff; font-size: 18px; text-shadow: 2px 2px #000; }
        .hp { font-size: 32px; color: #e74c3c; margin: 5px 0; text-shadow: 2px 2px #000; }
        .status { font-size: 14px; color: #aaa; background: #000; padding: 4px; border-radius: 5px; line-height: 1.2;}
        
        .log-box { background: rgba(0,0,0,0.85); color: #f1c40f; padding: 20px; flex-grow: 1; min-height: 150px; overflow-y: auto; text-align: left; font-size: 34px; line-height: 1.5; border-left: 10px solid #f1c40f; border-radius: 10px; margin: 10px auto; width: 90%; max-width: 1100px; box-sizing: border-box; box-shadow: 0 0 20px rgba(0,0,0,0.8);}
        
        .flip-card { background-color: transparent; width: 160px; height: 220px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 4px solid #f39c12; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
        .flip-front { background: url('/assets/bg_combat.png') center/cover; }
        .flip-front-rank { font-size: 32px; color: #fff; text-shadow: 3px 3px 5px #000; font-weight: bold; background: rgba(0,0,0,0.85); border: 3px solid #f1c40f; padding: 10px 15px; border-radius: 15px; box-shadow: 0 0 20px #f1c40f; }
        .flip-back { background: #16213e; transform: rotateY(180deg); border-color: #2ecc71; }
        .rank-num { font-size: 26px; color: #f1c40f; margin-bottom: 10px; }

        .anim-attack { animation: attackMove 0.4s infinite alternate; border-color: #c0392b; box-shadow: 0 0 25px #c0392b; transform: scale(1.1); z-index: 10;}
        .anim-defend { border-color: #3498db; box-shadow: 0 0 25px #3498db; transform: scale(1.1); z-index: 10;}
        .anim-hit { animation: shake 0.3s infinite; border-color: #e74c3c; background: rgba(127, 35, 28, 0.8); }
        .anim-magic { animation: magicPulse 0.5s infinite alternate; border-color: #9b59b6; box-shadow: 0 0 30px #9b59b6; transform: scale(1.1); z-index: 10;}
        .punish-highlight { border: 6px solid #e056fd !important; animation: shake 0.5s infinite; transform: scale(1.1); box-shadow: 0 0 30px #e056fd; }

        @keyframes attackMove { from { transform: translateY(0) scale(1.1); } to { transform: translateY(-20px) scale(1.1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes magicPulse { from { filter: hue-rotate(0deg); transform: scale(1.1); } to { filter: hue-rotate(90deg); transform: scale(1.1); } }

        .big-btn { font-family: 'Impact', sans-serif; padding: 15px 30px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 26px; margin: 10px; box-shadow: 0 6px 0 #2980b9;}
        .reset-btn { position: fixed; top: 15px; left: 15px; background: #c0392b; color: white; padding: 10px 15px; border-radius: 8px; border: 2px solid white; cursor: pointer; font-size: 16px; font-family: 'Impact', sans-serif; z-index: 1000; box-shadow: 0 4px #7f8c8d; }
        .kick-btn { margin-top: 5px; padding: 3px 8px; font-size:12px; background: #c0392b; color: white; border: none; border-radius: 5px; cursor: pointer; font-family: 'Impact', sans-serif; }
    </style>
</head>
<body>
    <button class="reset-btn" onclick="if(confirm('確定要重啟遊戲嗎？所有進度與連線部落將會重置！')) socket.emit('reset_game')">🔄 遊戲重啟</button>

    <h1 id="main-title" class="shadow-text">🔥 部落衝突：薩滿之戰 🔥</h1>

    <div id="view-setup" class="view active">
        <h2>設定部落數量</h2>
        <input type="number" id="teamCount" value="10" style="font-size: 45px; width: 100px; text-align: center; margin: 20px auto;"><br>
        <button class="big-btn" onclick="setupTeams()">初始化大廳</button>
    </div>

    <div id="view-lobby" class="view">
        <h2>🏠 等待部落連線中...</h2>
        <div id="lobby-grid" class="tribe-grid"></div>
        <div><button class="big-btn" style="background:#e74c3c; box-shadow: 0 6px 0 #c0392b;" onclick="startGame()">⚔️ START GAME</button></div>
    </div>

    <div id="view-qna" class="view">
        <div class="q-card">
            <div class="timer-display" id="teacher-timer">40</div>
            <div id="q-text" class="q-text">題目載入中...</div>
            <div class="options">
                <div class="opt" id="opt-A">A: </div><div class="opt" id="opt-B">B: </div>
                <div class="opt" id="opt-C">C: </div><div class="opt" id="opt-D">D: </div>
            </div>
            <div id="explanation" style="margin-top: 10px; background: #2c3e50; padding: 15px; text-align: left; display: none; font-size: 22px; border-radius:10px;"></div>
        </div>
        <div id="qna-grid" class="tribe-grid"></div>
        <div>
            <button id="btn-reveal" class="big-btn" onclick="control('reveal')">👁️ 公佈解答</button>
            <button id="btn-actions" class="big-btn" style="background:#e74c3c; display:none; box-shadow: 0 6px 0 #c0392b;" onclick="control('show_actions')">⚔️ 進入戰鬥環節</button>
        </div>
    </div>

    <div id="view-combat" class="view">
        <div id="combat-grid" class="tribe-grid"></div>
        <div class="log-box" id="combat-log"></div>
        <div>
            <button id="btn-next-action" class="big-btn" onclick="socket.emit('combat_step')">▶️ 進行下一個動作</button>
            <button id="btn-punish" class="big-btn" style="background:#8e44ad; display:none; box-shadow: 0 6px 0 #732d91;" onclick="control('resolve_punishments')">💀 進入天譴環節</button>
            <button id="btn-combat-end-round" class="big-btn" style="background:#f39c12; display:none;" onclick="control('end_round')">⏹️ 結束這回合</button>
        </div>
    </div>

    <div id="view-punish" class="view">
        <div id="punish-grid" class="tribe-grid"></div>
        
        <div id="teacher-punish-controls" style="display:none; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; border: 4px solid #e74c3c; margin: 15px auto; width: 600px;">
            <h2 id="punish-target-name" style="color: #ff7675; margin-top:0; font-size:36px;">⚠️ 正在懲罰：</h2>
            <button class="big-btn" style="background:#d63031;" onclick="socket.emit('teacher_submit_punish', 'take')">該部落自行承受傷害</button>
            <button class="big-btn" style="background:#6c5ce7;" onclick="socket.emit('teacher_submit_punish', 'pass')">無情加倍傳遞厄運盲盒</button>
        </div>

        <div class="log-box" id="punish-log"></div>
        
        <div>
            <button id="btn-start-magic" class="big-btn" style="background:#8e44ad; display:none; box-shadow: 0 6px 0 #732d91;" onclick="control('start_magic')">🪄 進入魔法祭壇</button>
            <button id="btn-punish-end-round" class="big-btn" style="background:#f39c12; display:none;" onclick="control('end_round')">⏹️ 結束這回合</button>
        </div>
    </div>

    <div id="view-transition" class="view" style="justify-content: center; align-items: center;">
        <h1 style="font-size: 80px; color: #f1c40f; text-shadow: 5px 5px 10px #000;" id="transition-title">第 X 題 結束</h1>
        <button id="btn-challenge-next" class="big-btn" style="font-size: 50px; padding: 30px 60px; background: #e74c3c; box-shadow: 0 10px 0 #c0392b; border-radius: 20px;" onclick="startCountdown()">準備挑戰第 X+1 題</button>
        <h1 id="countdown-text" style="font-size: 150px; color: #fff; text-shadow: 5px 5px 10px #000; display: none; margin:0;">3</h1>
    </div>

    <div id="view-endgame" class="view" style="justify-content: center;">
        <h2 style="font-size: 50px; color: #f1c40f; text-shadow: 3px 3px #000; margin: 20px 0;">🏆 終局結算排行榜 🏆</h2>
        <div id="endgame-grid" class="tribe-grid" style="gap: 30px; justify-content: center; align-items: center;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentQIndex = 0;
        let isSpecialQuestion = false;

        socket.on('timer_update', (time) => {
            const timerEl = document.getElementById('teacher-timer');
            timerEl.innerText = time;
            if(time <= 10) timerEl.style.background = '#8e44ad';
            else timerEl.style.background = '#e74c3c';
        });

        socket.on('state_update', (state) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            currentQIndex = state.currentQuestionIndex;
            
            if(state.question) {
                isSpecialQuestion = state.question['題目類型'] === '特殊';
            }

            if(state.phase === 'show_actions') {
                document.body.style.backgroundImage = "url('/assets/bg_combat.png')";
                document.getElementById('main-title').style.display = 'none';
            } else if (['punish_turn', 'punishments_done'].includes(state.phase)) {
                document.body.style.backgroundImage = "url('/assets/bg_punish.png')";
                document.getElementById('main-title').style.display = 'none';
            } else if (state.phase === 'magic_phase') {
                document.body.style.backgroundImage = "url('/assets/bg_combat.png')";
                document.getElementById('main-title').style.display = 'none';
            } else if (state.phase === 'round_transition' || state.phase === 'end_game') {
                document.body.style.backgroundImage = "none";
                document.getElementById('main-title').style.display = 'none';
            } else {
                document.body.style.backgroundImage = "none";
                document.getElementById('main-title').style.display = 'block';
            }

            if(state.phase === 'setup') document.getElementById('view-setup').classList.add('active');
            else if(state.phase === 'lobby') {
                document.getElementById('view-lobby').classList.add('active');
                renderGrid('lobby-grid', state);
            } 
            else if (['answering', 'reveal_answers'].includes(state.phase)) {
                document.getElementById('view-qna').classList.add('active');
                if(state.phase === 'answering') document.getElementById('teacher-timer').innerText = state.timeLeft;
                renderQnA(state);
                renderGrid('qna-grid', state);
            }
            else if (state.phase === 'show_actions' || state.phase === 'magic_phase') {
                document.getElementById('view-combat').classList.add('active');
                renderGrid('combat-grid', state);
                
                const qLen = state.combatQueue.length;
                document.getElementById('btn-next-action').style.display = (qLen > 0) ? 'inline-block' : 'none';
                
                if (state.phase === 'show_actions') {
                    document.getElementById('btn-punish').style.display = (qLen === 0) ? 'inline-block' : 'none';
                    document.getElementById('btn-combat-end-round').style.display = 'none';
                } else {
                    document.getElementById('btn-punish').style.display = 'none';
                    if (qLen === 0) {
                        document.getElementById('btn-combat-end-round').style.display = 'inline-block';
                        if(currentQIndex >= 9) document.getElementById('btn-combat-end-round').innerText = '🏆 進入最終結算';
                    } else {
                        document.getElementById('btn-combat-end-round').style.display = 'none';
                    }
                }
                
                const logBox = document.getElementById('combat-log');
                logBox.innerHTML = state.logs.map(l => `<p style="margin:5px 0;">> ${l}</p>`).join('');
                logBox.scrollTop = logBox.scrollHeight;
            }
            else if (['punish_turn', 'punishments_done'].includes(state.phase)) {
                document.getElementById('view-punish').classList.add('active');
                renderGrid('punish-grid', state);
                
                const logBox = document.getElementById('punish-log');
                logBox.innerHTML = state.logs.map(l => `<p style="margin:5px 0;">> ${l}</p>`).join('');
                logBox.scrollTop = logBox.scrollHeight;

                const punishControls = document.getElementById('teacher-punish-controls');
                if(state.phase === 'punish_turn' && state.currentPunishTeam !== 'waiting') {
                    punishControls.style.display = 'block';
                    document.getElementById('punish-target-name').innerText = `⚠️ 正在懲罰：${state.teams[state.currentPunishTeam].name}`;
                } else {
                    punishControls.style.display = 'none';
                }
                
                if(state.phase === 'punishments_done') {
                    if (isSpecialQuestion || currentQIndex === 9) {
                        document.getElementById('btn-start-magic').style.display = 'inline-block';
                        document.getElementById('btn-punish-end-round').style.display = 'none';
                    } else {
                        document.getElementById('btn-start-magic').style.display = 'none';
                        document.getElementById('btn-punish-end-round').style.display = 'inline-block';
                        if(currentQIndex >= 9) document.getElementById('btn-punish-end-round').innerText = '🏆 進入最終結算';
                    }
                } else {
                    document.getElementById('btn-start-magic').style.display = 'none';
                    document.getElementById('btn-punish-end-round').style.display = 'none';
                }
            }
            else if (state.phase === 'round_transition') {
                document.getElementById('view-transition').classList.add('active');
                document.getElementById('transition-title').innerText = `第 ${currentQIndex + 1} 題 結束`;
                document.getElementById('btn-challenge-next').innerText = `準備挑戰第 ${currentQIndex + 2} 題`;
                document.getElementById('btn-challenge-next').style.display = 'inline-block';
                document.getElementById('countdown-text').style.display = 'none';
                if(currentQIndex >= 9) control('end_game'); 
            }
            else if (state.phase === 'end_game') {
                document.getElementById('view-endgame').classList.add('active');
                renderEndGame(state.endGameRanks);
            }
        });

        function setupTeams() { socket.emit('teacher_setup', document.getElementById('teamCount').value); }
        function startGame() { socket.emit('teacher_start'); }
        function control(action) { 
            if(action === 'end_round' && currentQIndex >= 9) socket.emit('teacher_control', 'end_game');
            else socket.emit('teacher_control', action); 
        }

        function startCountdown() {
            let count = 3;
            document.getElementById('btn-challenge-next').style.display = 'none';
            const cdText = document.getElementById('countdown-text');
            cdText.style.display = 'block';
            cdText.innerText = count;
            
            let iv = setInterval(() => {
                count--;
                if(count > 0) cdText.innerText = count;
                else {
                    clearInterval(iv);
                    control('next'); 
                }
            }, 1000);
        }

        function renderQnA(state) {
            const q = state.question;
            if(!q) return;
            document.getElementById('q-text').innerText = `Q${state.currentQuestionIndex + 1}. ${q['題目']} (${(q['題目類型'] === '特殊' || state.currentQuestionIndex===9) ? '🌟魔法題' : '📜普通題'})`;
            ['A','B','C','D'].forEach(o => {
                const opt = document.getElementById(`opt-${o}`);
                opt.innerText = `${o}: ${q[o]}`;
                opt.classList.remove('opt-correct');
                if(state.phase !== 'answering' && q['正確答案'] === o) opt.classList.add('opt-correct');
            });
            const exp = document.getElementById('explanation');
            if(state.phase !== 'answering' && q['詳解']) { exp.style.display = 'block'; exp.innerHTML = `💡 詳解：${q['詳解']}`; } 
            else { exp.style.display = 'none'; }
            
            document.getElementById('btn-reveal').style.display = (state.phase === 'answering') ? 'inline-block' : 'none';
            document.getElementById('btn-actions').style.display = (state.phase === 'reveal_answers') ? 'inline-block' : 'none';
        }

        function renderGrid(containerId, state) {
            const g = document.getElementById(containerId); g.innerHTML = '';
            Object.values(state.teams).forEach(t => {
                let cardClass = 'card';
                let status = t.locked ? '🔒 已鎖定' : '⏳ 等待作答...';
                
                if(containerId === 'lobby-grid') {
                    status = t.connected 
                        ? `🟢 已連線<br><button class="kick-btn" onclick="socket.emit('force_disconnect', '${t.id}')">斷線重連</button>` 
                        : '⏳ 等待中';
                }
                
                if(t.locked) cardClass += ' locked';
                
                if(['show_actions', 'magic_phase'].includes(state.phase) && state.currentCombatEvent) {
                    if(state.currentCombatEvent.actor === t.id || state.currentCombatEvent.target === t.id) {
                        cardClass += ` anim-${state.currentCombatEvent.anim}`;
                    }
                }

                if(state.phase === 'punish_turn' && state.currentPunishTeam === t.id) cardClass += ' punish-highlight';
                else if(state.phase !== 'answering' && state.phase !== 'show_actions' && state.phase !== 'magic_phase' && containerId !== 'lobby-grid') {
                    if(t.answer) status = t.isCorrect ? '⭕ 答對' : '❌ 超時未答';
                    else if(t.locked) status = '❌ 超時未答';
                }
                
                let imgSrc = `/assets/${t.id}.png`;

                g.innerHTML += `<div class="${cardClass}">
                    <h3>${t.name}</h3>
                    <img src="${imgSrc}" onerror="this.src='/assets/shaman_blocky.png'">
                    <div class="hp">${t.hp}</div>
                    <div class="status">${status}</div>
                </div>`;
            });
        }

        function renderEndGame(ranks) {
            const g = document.getElementById('endgame-grid'); g.innerHTML = '';
            ranks.forEach((t, index) => {
                const rankNum = index + 1;
                g.innerHTML += `
                <div class="flip-card" onclick="this.classList.toggle('flipped')">
                    <div class="flip-card-inner">
                        <div class="flip-front">
                            <div class="flip-front-rank">第 ${rankNum} 名</div>
                        </div>
                        <div class="flip-back">
                            <div class="rank-num">第 ${rankNum} 名</div>
                            <img src="/assets/${t.id}.png" onerror="this.src='/assets/shaman_blocky.png'" style="width:70px;height:70px;image-rendering:pixelated;">
                            <h3 style="margin:5px 0; color:#fff;">${t.name}</h3>
                            <div style="font-size:30px; color:#e74c3c; font-weight:bold;">${t.hp}❤️</div>
                        </div>
                    </div>
                </div>`;
            });
        }
    </script>
</body>
</html>
